{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{% block meta_description %}AIBiz Thailand — AI Automation สำหรับธุรกิจ SME ไทย{% endblock %}" />
  <title>{% block title %}AIBiz Thailand{% endblock %}</title>
  {% block og_image %}{% endblock %}
  {% block extra_head %}{% endblock %}

  <script src="{% static 'vendor/bootstrap/js/color-modes.js' %}"></script>
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="{% static 'vendor/bootstrap/css/blog.css' %}" rel="stylesheet" />
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet" />
  <link href="{% static 'css/main.css' %}" rel="stylesheet" />
  <style>
    body {
      font-family: 'Sarabun', 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 1.75;
      letter-spacing: 0.01em;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Sarabun', 'Inter', sans-serif;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    code, pre, kbd {
      font-family: 'Inter', 'JetBrains Mono', ui-monospace, monospace;
    }
  </style>

  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- SVG sprites — ใช้โดย theme toggle ใน navbar -->
  <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
    <symbol id="check2" viewBox="0 0 16 16">
      <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
    </symbol>
    <symbol id="circle-half" viewBox="0 0 16 16">
      <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/>
    </symbol>
    <symbol id="moon-stars-fill" viewBox="0 0 16 16">
      <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
      <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.734 1.734 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.734 1.734 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.734 1.734 0 0 0 1.097-1.097l.387-1.162z"/>
    </symbol>
    <symbol id="sun-fill" viewBox="0 0 16 16">
      <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/>
    </symbol>
  </svg>

  {% include "pages/navbar.html" %}

  {% block content %}{% endblock %}


  <!-- === FLOATING CHAT BUTTON === -->
  <a href="{% url 'pages:contact' %}" class="fab-chat" aria-label="ติดต่อเรา" title="ติดต่อเรา">
    <i class="bi bi-chat-dots-fill"></i>
    <span class="fab-tooltip">ปรึกษาฟรี</span>
  </a>
  <style>
    .fab-chat {
      position: fixed;
      bottom: 1.75rem;
      right: 1.75rem;
      z-index: 1040;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--brand-gold);
      color: var(--brand-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 4px 20px rgba(201,169,110,.45);
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }
    .fab-chat:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 28px rgba(201,169,110,.6);
      color: var(--brand-dark);
    }
    .fab-tooltip {
      position: absolute;
      right: calc(100% + .65rem);
      background: var(--brand-dark);
      color: #fff;
      font-size: .78rem;
      font-weight: 600;
      white-space: nowrap;
      padding: .35rem .75rem;
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .fab-chat:hover .fab-tooltip { opacity: 1; }
  </style>
  <!-- === END FLOATING CHAT BUTTON === -->

  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
