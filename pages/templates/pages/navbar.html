{% load static %}
<nav class="navbar navbar-expand-lg border-bottom">
  <div class="container">

    <!-- Brand / Logo -->
    <a class="navbar-brand fw-bold fs-4 me-4" href="{% url 'pages:home' %}">
      AI<span class="text-gold">Biz</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="siteNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'pages:home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.app_name == 'blog' %}active{% endif %}" href="{% url 'blog:list' %}">Blog</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.app_name == 'portfolio' %}active{% endif %}" href="{% url 'portfolio:list' %}">Portfolio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'services' %}active{% endif %}" href="{% url 'pages:services' %}">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'pages:about' %}">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'pages:contact' %}">Contact</a>
        </li>
      </ul>

      <!-- Search bar -->
      <form class="d-flex" role="search" action="{% url 'blog:list' %}" method="get">
        <div class="input-group input-group-sm">
          <input class="form-control" type="search" name="q" placeholder="ค้นหาบทความ..." aria-label="Search" value="{{ request.GET.q }}">
          <button class="btn btn-outline-primary" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>

      <!-- Social links -->
      <div class="d-flex align-items-center gap-2 ms-3">
        <a href="#" class="text-body-secondary" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
        <a href="#" class="text-body-secondary" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
      </div>
    </div>

  </div>
</nav>
